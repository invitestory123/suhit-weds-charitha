    <script>
      (function() {
        const audio = document.getElementById('bg-audio');
        const toggleBtn = document.getElementById('music-toggle');
        let isStarted = false;

        audio.muted = false;

        // Sync with WEDDING_DATA music track if specified
        if (window.WEDDING_DATA && window.WEDDING_DATA.music && window.WEDDING_DATA.music.track) {
          const srcTag = audio.querySelector('source');
          if (srcTag && srcTag.getAttribute('src') !== window.WEDDING_DATA.music.track) {
            srcTag.src = window.WEDDING_DATA.music.track;
            audio.load();
          }
        }

        // Sync WhatsApp RSVP link if configured in WEDDING_DATA
        if (window.WEDDING_DATA && window.WEDDING_DATA.rsvp) {
          const rsvpLink = document.getElementById('whatsapp-rsvp');
          if (rsvpLink) {
            const num = window.WEDDING_DATA.rsvp.whatsappNumber || "918008066366";
            const msg = encodeURIComponent(window.WEDDING_DATA.rsvp.message || "Hello! We would like to RSVP for Suhit & Sai Charitha's wedding reception.");
            rsvpLink.href = "https://wa.me/" + num + "?text=" + msg;
          }
        }

        window.startBgMusic = function() {
          if (!isStarted) {
            isStarted = true;
          }
          audio.muted = false;
          audio.play().then(() => {
            toggleBtn.style.display = 'flex';
            toggleBtn.classList.add('is-playing');
          }).catch((err) => {
            // Autoplay policy may require explicit user click
            toggleBtn.style.display = 'flex';
            toggleBtn.classList.remove('is-playing');
          });
        };

        // Start background music on user touch or click
        document.addEventListener('pointerdown', function() {
          window.startBgMusic();
        }, { passive: true });

        document.addEventListener('click', function() {
          window.startBgMusic();
        }, { passive: true });

        toggleBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (audio.paused || audio.muted) {
            audio.muted = false;
            audio.play().then(() => {
              toggleBtn.classList.add('is-playing');
            }).catch(console.error);
          } else {
            audio.pause();
            toggleBtn.classList.remove('is-playing');
          }
        });
      })();
    </script>
